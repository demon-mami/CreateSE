<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#40535d">
  <title>osu!taiko Hitsound Lab</title>
  <link rel="stylesheet" href="./style.css?v=0.1">
  <link rel="stylesheet" href="./theme-col07.css?v=0.1">
  <style>
.chart-field{display:block}.chart-field select{min-height:42px;font-size:12px;font-weight:750}.chart-info{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:8px;margin-top:9px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}.chart-info>div{min-width:0}.chart-info strong{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;line-height:1.35}.chart-hits{position:absolute;right:8px;bottom:6px;color:var(--muted);font-size:8px;font-variant-numeric:tabular-nums}@media(max-width:430px){.chart-info{grid-template-columns:1fr}.chart-info strong{padding-right:54px}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="appbar">
      <div class="brand-block">
        <span class="brand-kicker">demon mami's</span>
        <h1>Hitsound Lab</h1>
      </div>
      <span id="statusBadge" class="status-badge">待機中</span>
    </header>

    <section class="source-panel panel">
      <label class="chart-field">
        <span class="label">TEST CHART</span>
        <select id="chartSelect">
          <option value="">譜面を選択してください</option>
        </select>
      </label>

      <div class="chart-info">
        <div>
          <span class="label">TITLE</span>
          <strong id="songTitle">—</strong>
        </div>
        <div>
          <span class="label">DIFFICULTY</span>
          <strong id="fixedDifficulty">—</strong>
        </div>
        <span id="songMeta" class="chart-hits">—</span>
      </div>

      <input id="oszInput" type="file" accept=".osz,.OSZ" hidden>
      <select id="difficultySelect" hidden disabled><option>固定難易度</option></select>
      <p id="fileName" hidden></p>
      <input id="donHitsoundInput" type="file" accept="audio/*,.wav" hidden>
      <input id="kaHitsoundInput" type="file" accept="audio/*,.wav" hidden>

      <div class="pair-builder" aria-label="Hitsound Pair Builder">
        <div class="pair-builder-head">
          <div>
            <span class="label">HITSOUND PAIR</span>
            <strong>Low Don / High Kat</strong>
          </div>
          <label class="scope-field">
            <span>Scope</span>
            <select id="pairScope">
              <option value="ALL">All</option>
              <option value="SAME">Same family</option>
            </select>
          </label>
        </div>

        <div class="pair-grid">
          <div class="pair-side don-side">
            <div class="pair-side-head">
              <div class="pair-side-title"><span class="dot don-dot"></span>Don — LOW</div>
              <button id="favDonButton" class="favorite-button side-favorite" type="button">DON ★</button>
            </div>
            <select id="donSelect"></select>
            <div id="donMeta" class="pair-meta"></div>
            <div class="pair-actions">
              <button id="donPrev" type="button">←</button>
              <button id="donPreview" type="button">▶ Don</button>
              <button id="donNext" type="button">→</button>
            </div>
          </div>

          <div class="pair-side kat-side">
            <div class="pair-side-head">
              <div class="pair-side-title"><span class="dot kat-dot"></span>Kat — HIGH</div>
              <button id="favKatButton" class="favorite-button side-favorite" type="button">KAT ★</button>
            </div>
            <select id="katSelect"></select>
            <div id="katMeta" class="pair-meta"></div>
            <div class="pair-actions">
              <button id="katPrev" type="button">←</button>
              <button id="katPreview" type="button">▶ Kat</button>
              <button id="katNext" type="button">→</button>
            </div>
          </div>
        </div>

        <div class="pair-rule-row pair-rule-only">
          <span id="pairRule" class="pair-rule"></span>
        </div>

        <div class="pair-footer-actions">
          <button id="favSetButton" class="favorite-button set-favorite" type="button">SET ★</button>
          <button id="exportFavoritesButton" class="favorite-button export" type="button">CSV出力</button>
        </div>
      </div>
    </section>

    <section class="editor-panel panel" aria-label="譜面再生">
      <div id="timelineViewport" class="timeline-viewport" aria-label="現在位置周辺のTaikoヒットポイント">
        <canvas id="timelineStaticCanvas" class="timeline-static"></canvas>
        <canvas id="timelineCursorCanvas" class="timeline-cursor"></canvas>
      </div>

      <div id="overviewViewport" class="overview-viewport" aria-label="曲全体">
        <canvas id="overviewStaticCanvas" class="overview-static"></canvas>
        <canvas id="overviewCursorCanvas" class="overview-cursor"></canvas>
        <span id="timeDisplay" class="song-time">00:00:000</span>
      </div>

      <input id="seekBar" class="seek-bar" type="range" min="0" max="1" step="0.001" value="0" disabled>

      <div class="editor-control-grid">
        <div class="transport-row">
          <button id="backButton" class="transport-button" type="button" disabled>−4s</button>
          <button id="playButton" class="play-button" type="button" disabled>▶</button>
          <button id="forwardButton" class="transport-button" type="button" disabled>+4s</button>
        </div>
        <div class="zoom-controls compact-zoom">
          <button id="zoomOutButton" type="button" disabled>−</button>
          <span id="zoomLabel" class="zoom-label">±0.5s</span>
          <button id="zoomInButton" type="button" disabled>＋</button>
        </div>
      </div>
    </section>

    <section id="errorCard" class="error-panel panel" hidden>
      <strong>読み込みエラー</strong>
      <p id="errorMessage"></p>
    </section>
  </main>

  <audio id="samplePreviewAudio" preload="none"></audio>
  <script src="./vendor/jszip.min.js?v=3.10.1"></script>
  <script src="./candidates.js?v=0.1"></script>
  <script src="./candidate-numbering.js?v=0.2"></script>
  <script src="./charts.js?v=0.2"></script>
  <script src="./app-v4.js?v=c22e29e4"></script>
  <script src="./object-timeline-v2.js?v=viewer-exact-20260819"></script>
  <script src="./lab.js?v=0.2"></script>
  <script src="./pair-ranking.js?v=0.5"></script>
  <script src="./favorite-shortcuts.js?v=0.1"></script>
  <script src="./chart-loader.js?v=0.2"></script>
</body>
</html>
