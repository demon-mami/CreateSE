<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#40535d">
  <title>osu!taiko Hitsound Lab</title>
  <link rel="stylesheet" href="./style.css?v=0.1">
  <link rel="stylesheet" href="./theme-col07.css?v=0.1">
  <link rel="stylesheet" href="./hitsound-grid.css?v=2.0-single-base-116">
  <style>
    .chart-field{display:block}.chart-field select{height:46px;min-height:46px;font-size:12px;font-weight:750}
    .chart-info{display:flex;align-items:center;min-height:34px;margin-top:8px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
    .chart-info strong{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;line-height:1.2}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="appbar">
      <div class="brand-block">
        <span class="brand-kicker">demon mami's</span>
        <h1>Hitsound Lab</h1>
      </div>
      <span id="statusBadge" class="status-badge">待機中</span>
    </header>

    <section class="source-panel panel">
      <label class="chart-field">
        <select id="chartSelect" aria-label="譜面を選択">
          <option value="">譜面を選択</option>
        </select>
      </label>

      <div class="chart-info" aria-label="難易度">
        <strong id="fixedDifficulty">—</strong>
        <span id="songTitle" hidden>—</span>
        <span id="songMeta" hidden>—</span>
      </div>

      <input id="oszInput" type="file" accept=".osz,.OSZ" hidden>
      <select id="difficultySelect" hidden disabled><option>固定難易度</option></select>
      <p id="fileName" hidden></p>
      <input id="donHitsoundInput" type="file" accept="audio/*,.wav" hidden>
      <input id="kaHitsoundInput" type="file" accept="audio/*,.wav" hidden>
      <input id="customHitsoundInput" type="file" accept="audio/*,.wav" hidden>

      <div class="pair-builder" aria-label="Hitsound selector">
        <div class="hs-toolbar">
          <button id="roleDonButton" class="hs-role-button don target" type="button" aria-label="DON割当先" aria-pressed="true"><span>Don</span></button>
          <button id="roleKatButton" class="hs-role-button kat" type="button" aria-label="KAT割当先" aria-pressed="false"><span>Kat</span></button>

          <div class="hs-toolbar-actions">
            <button id="silentButton" class="hs-action-button compact" type="button" aria-label="選択中を無音にする"><span>—</span></button>
            <button id="previewButton" class="hs-action-button compact" type="button" aria-label="曲を再生" aria-pressed="false" disabled><span>▶</span></button>
            <button id="favSetButton" class="hs-action-button" type="button" aria-label="現在の組み合わせをお気に入り登録" title="現在の組み合わせをお気に入り登録"><span class="hs-set-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M7 10v12M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 8a2 2 0 0 1-1.9 1.4H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9Z"/></svg></span></button>
            <button id="exportFavoritesButton" class="hs-action-button" type="button" aria-label="CSV出力"><span>CSV</span></button>
          </div>
        </div>

        <div id="recommendationLine" class="hs-recommendation">推奨：—</div>
        <div id="hitsoundGrid" data-active-side="don" aria-label="音源一覧">
          <section id="customSoundSection" class="hs-family hs-custom-family" aria-label="ユーザー音源">
            <div class="hs-family-title hs-custom-title">
              <span>My Sound</span>
              <span id="customSoundCount" aria-live="polite">0 / 4</span>
            </div>
            <div id="customSoundSlots" class="custom-sound-grid" aria-busy="true"></div>
          </section>
          <div id="hitsoundSources"></div>
          <section id="savedSetsPanel" class="hs-family hs-favorite-family" aria-label="Favorite SET">
            <div class="hs-family-title">Favorite</div>
            <div id="savedSetsList" class="favorite-set-grid"></div>
          </section>
        </div>
      </div>
    </section>

    <section class="editor-panel panel" aria-label="譜面再生">
      <div id="timelineViewport" class="timeline-viewport" aria-label="現在位置周辺のTaikoヒットポイント">
        <canvas id="timelineStaticCanvas" class="timeline-static"></canvas>
        <canvas id="timelineCursorCanvas" class="timeline-cursor"></canvas>
      </div>

      <div id="overviewViewport" class="overview-viewport" aria-label="曲全体">
        <canvas id="overviewStaticCanvas" class="overview-static"></canvas>
        <canvas id="overviewCursorCanvas" class="overview-cursor"></canvas>
        <span id="timeDisplay" class="song-time">00:00:000</span>
      </div>

      <input id="seekBar" class="seek-bar" type="range" min="0" max="1" step="0.001" value="0" disabled>

      <div class="editor-control-grid">
        <div class="transport-row">
          <button id="backButton" class="transport-button" type="button" disabled>−4s</button>
          <button id="playButton" class="play-button" type="button" disabled>▶</button>
          <button id="forwardButton" class="transport-button" type="button" disabled>+4s</button>
        </div>
        <div class="zoom-controls compact-zoom">
          <button id="zoomOutButton" type="button" disabled>−</button>
          <span id="zoomLabel" class="zoom-label">±0.5s</span>
          <button id="zoomInButton" type="button" disabled>＋</button>
        </div>
      </div>
    </section>

    <section id="errorCard" class="error-panel panel" hidden>
      <strong>読み込みエラー</strong>
      <p id="errorMessage"></p>
    </section>
  </main>

  <audio id="samplePreviewAudio" preload="none"></audio>
  <script>
    (() => {
      const datasetVersion = 'single-base-116-20260821';
      const versionKey = 'CreateSE:dataset-version';
      try {
        if (localStorage.getItem(versionKey) !== datasetVersion) {
          localStorage.removeItem('osutaiko-hitsound-lab:pinned-sources:v1');
          localStorage.removeItem('osutaiko-hitsound-lab-favorites-v1');
          localStorage.setItem(versionKey, datasetVersion);
        }
      } catch {}
    })();
  </script>
  <script src="./vendor/jszip.min.js?v=3.10.1"></script>
  <script src="./candidates.js?v=2.0-single-base-116"></script>
  <script src="./candidate-numbering.js?v=3.0"></script>
  <script src="./charts.js?v=0.2"></script>
  <script src="./audio-ducking-bridge.js?v=1.0"></script>
  <script src="./app-v4.js?v=2.1"></script>
  <script src="./object-timeline-v2.js?v=viewer-exact-20260819"></script>
  <script src="./hitsound-controller.js?v=2.0-single-base-116"></script>
  <script src="./hitsound-favorites.js?v=2.0-single-base-116"></script>
  <script src="./hitsound-grid.js?v=2.0-single-base-116"></script>
  <script src="./chart-loader.js?v=0.4"></script>
</body>
</html>
