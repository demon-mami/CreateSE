<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#40535d">
  <title>osu!taiko Hitsound Lab</title>
  <link rel="stylesheet" href="./style.css?v=0.1">
  <link rel="stylesheet" href="./theme-col07.css?v=0.1">
  <link rel="stylesheet" href="./hitsound-grid.css?v=1.0">
  <style>
.chart-field{display:block}.chart-field select{min-height:42px;font-size:12px;font-weight:750}.chart-info{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:8px;margin-top:9px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}.chart-info[hidden]{display:none!important}.chart-info>div{min-width:0}.chart-info strong{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;line-height:1.35}.chart-hits{display:none!important}.chart-hits{position:absolute;right:8px;bottom:6px;color:var(--muted);font-size:8px;font-variant-numeric:tabular-nums}@media(max-width:430px){.chart-info{grid-template-columns:1fr}.chart-info strong{padding-right:54px}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="appbar">
      <div class="brand-block">
        <span class="brand-kicker">demon mami's</span>
        <h1>Hitsound Lab</h1>
      </div>
      <span id="statusBadge" class="status-badge">待機中</span>
    </header>

    <section class="source-panel panel">
      <label class="chart-field">
        <select id="chartSelect" aria-label="譜面を選択">
          <option value="">譜面を選択</option>
        </select>
      </label>

      <div class="chart-info" hidden>
        <div><strong id="songTitle">—</strong></div>
        <div><strong id="fixedDifficulty">—</strong></div>
        <span id="songMeta" class="chart-hits">—</span>
      </div>

      <input id="oszInput" type="file" accept=".osz,.OSZ" hidden>
      <select id="difficultySelect" hidden disabled><option>固定難易度</option></select>
      <p id="fileName" hidden></p>
      <input id="donHitsoundInput" type="file" accept="audio/*,.wav" hidden>
      <input id="kaHitsoundInput" type="file" accept="audio/*,.wav" hidden>

      <div class="pair-builder" aria-label="Hitsound selector">
        <div class="hs-toolbar">
          <div class="hs-role-pack">
            <button id="roleDonButton" class="hs-role-button don" type="button" aria-label="DON割当先"><span id="roleDonValue">—</span></button>
            <button id="favDonButton" class="hs-mini-action" type="button" aria-label="DONをお気に入り">★</button>
            <button id="donPreview" class="hs-mini-action" type="button" aria-label="DON単音を再生または一時停止">▶</button>
          </div>

          <div class="hs-role-pack">
            <button id="roleKatButton" class="hs-role-button kat" type="button" aria-label="KAT割当先"><span id="roleKatValue">—</span></button>
            <button id="favKatButton" class="hs-mini-action" type="button" aria-label="KATをお気に入り">★</button>
            <button id="katPreview" class="hs-mini-action" type="button" aria-label="KAT単音を再生または一時停止">▶</button>
          </div>

          <div class="hs-toolbar-actions">
            <button id="favSetButton" class="hs-mini-action" type="button" aria-label="SETをお気に入り">★SET</button>
            <button id="exportFavoritesButton" class="hs-mini-action" type="button" aria-label="CSV出力">CSV</button>
          </div>
        </div>

        <div id="hitsoundGrid" aria-label="音源一覧"></div>
      </div>
    </section>

    <section class="editor-panel panel" aria-label="譜面再生">
      <div id="timelineViewport" class="timeline-viewport" aria-label="現在位置周辺のTaikoヒットポイント">
        <canvas id="timelineStaticCanvas" class="timeline-static"></canvas>
        <canvas id="timelineCursorCanvas" class="timeline-cursor"></canvas>
      </div>

      <div id="overviewViewport" class="overview-viewport" aria-label="曲全体">
        <canvas id="overviewStaticCanvas" class="overview-static"></canvas>
        <canvas id="overviewCursorCanvas" class="overview-cursor"></canvas>
        <span id="timeDisplay" class="song-time">00:00:000</span>
      </div>

      <input id="seekBar" class="seek-bar" type="range" min="0" max="1" step="0.001" value="0" disabled>

      <div class="editor-control-grid">
        <div class="transport-row">
          <button id="backButton" class="transport-button" type="button" disabled>−4s</button>
          <button id="playButton" class="play-button" type="button" disabled>▶</button>
          <button id="forwardButton" class="transport-button" type="button" disabled>+4s</button>
        </div>
        <div class="zoom-controls compact-zoom">
          <button id="zoomOutButton" type="button" disabled>−</button>
          <span id="zoomLabel" class="zoom-label">±0.5s</span>
          <button id="zoomInButton" type="button" disabled>＋</button>
        </div>
      </div>
    </section>

    <section id="errorCard" class="error-panel panel" hidden>
      <strong>読み込みエラー</strong>
      <p id="errorMessage"></p>
    </section>
  </main>

  <audio id="samplePreviewAudio" preload="none"></audio>
  <script src="./vendor/jszip.min.js?v=3.10.1"></script>
  <script src="./candidates.js?v=0.1"></script>
  <script src="./candidate-numbering.js?v=1.0"></script>
  <script src="./charts.js?v=0.2"></script>
  <script src="./app-v4.js?v=c22e29e4"></script>
  <script src="./object-timeline-v2.js?v=viewer-exact-20260819"></script>
  <script src="./hitsound-controller.js?v=1.0"></script>
  <script src="./hitsound-favorites.js?v=1.0"></script>
  <script src="./hitsound-grid.js?v=1.0"></script>
  <script src="./chart-loader.js?v=0.3"></script>
</body>
</html>
