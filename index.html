<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#40535d">
  <title>まみ専用 SE確認</title>
  <link rel="stylesheet" href="./style.css?v=0.1">
  <link rel="stylesheet" href="./theme-col07.css?v=0.1">
  <link rel="stylesheet" href="./hitsound-grid.css?v=4.6-filename-label">
  <link rel="stylesheet" href="./workbench.css?v=2.2-music-volume-five">
  <style>
    .transport-row{display:flex!important;justify-content:center!important;align-items:center!important;padding-inline:0!important}
    .transport-row .play-button{width:96px!important;min-width:96px!important}
    .orientation-guard[hidden]{display:none!important}
    .orientation-guard{position:fixed;inset:0;z-index:10000;place-items:center;padding:28px;background:#071018;color:#fff;text-align:center;font:800 16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}
    html.orientation-blocked body>:not(.orientation-guard){visibility:hidden!important;pointer-events:none!important}
    html.orientation-blocked .orientation-guard{display:grid!important;visibility:visible!important}
    @media(max-width:899px) and (orientation:portrait){
      .hs-toolbar:has(.favorite-quick-dropdown:not([hidden])){z-index:75!important}
      .favorite-quick-dropdown{
        z-index:90!important;
        max-height:min(330px,40dvh)!important;
        -webkit-overflow-scrolling:touch;
        touch-action:pan-y;
      }
    }
  </style>
</head>
<body>
  <div id="orientationGuard" class="orientation-guard" hidden role="alert"></div>
  <a class="skip-link" href="#auditionPanel">比較操作へ移動</a>
  <main class="app-shell">
    <header class="appbar">
      <div class="brand-block">
        <span class="brand-kicker">demon mami's</span>
        <h1>まみ専用 SE確認</h1>
      </div>
      <span id="statusBadge" class="status-badge sr-only" role="status" aria-live="polite">譜面を選択</span>
    </header>

    <section class="chart-bar panel" aria-label="譜面">
      <label class="chart-field" for="chartSelect">
        <span class="field-label">譜面</span>
        <select id="chartSelect" aria-label="譜面を選択">
          <option value="">譜面を選択</option>
        </select>
      </label>

      <div class="chart-info" aria-label="選択中の難易度">
        <span class="field-label">難易度</span>
        <strong id="fixedDifficulty">—</strong>
        <span id="songTitle" hidden>—</span>
        <span id="songMeta" hidden>—</span>
      </div>
    </section>

    <div class="workbench">
    <section class="source-panel panel" aria-label="Hitsound候補">
      <input id="oszInput" type="file" accept=".osz,.OSZ" hidden>
      <select id="difficultySelect" hidden disabled><option>固定難易度</option></select>
      <p id="fileName" hidden></p>
      <input id="customHitsoundInput" type="file" accept=".wav,audio/wav" hidden>

      <div class="pair-builder" aria-label="Hitsound selector">
        <div class="hs-toolbar">
          <span class="hs-toolbar-label">操作対象</span>
          <div class="role-switch" role="group" aria-label="候補の割当先">
            <button id="roleDonButton" class="hs-role-button don target" type="button" aria-label="Donを操作対象にする" aria-pressed="true"><span><strong>Don</strong><small id="roleDonCurrent">—</small></span></button>
            <button id="roleKatButton" class="hs-role-button kat" type="button" aria-label="Katを操作対象にする" aria-pressed="false"><span><strong>Kat</strong><small id="roleKatCurrent">—</small></span></button>
          </div>
          <section class="judgment-panel" aria-label="候補の判断">
            <h2>判断</h2>
            <div class="judgment-actions">
              <div class="favorite-split favorite-one-split">
                <button id="favoriteOneButton" class="quick-favorite favorite-one" type="button" aria-label="現在の組み合わせをお気に入り①へ登録" aria-pressed="false" disabled>♡</button>
                <button id="favoriteOneListButton" class="favorite-list-button" type="button" aria-label="お気に入り①の登録済み組み合わせを表示" aria-haspopup="menu" aria-expanded="false" aria-controls="favoriteQuickDropdown">お気に入り①</button>
              </div>
              <div class="favorite-split favorite-two-split">
                <button id="favoriteTwoButton" class="quick-favorite favorite-two" type="button" aria-label="現在の組み合わせをお気に入り②へ登録" aria-pressed="false" disabled>☆</button>
                <button id="favoriteTwoListButton" class="favorite-list-button" type="button" aria-label="お気に入り②の登録済み組み合わせを表示" aria-haspopup="menu" aria-expanded="false" aria-controls="favoriteQuickDropdown">お気に入り②</button>
              </div>
              <button id="favoriteOpenButton" class="preset-action" type="button" aria-label="固定セットを表示" aria-haspopup="menu" aria-expanded="false" aria-controls="favoriteQuickDropdown"><span class="set-check-icon" aria-hidden="true">::</span><span>セット</span></button>
            </div>
            <div id="setFeedback" class="set-feedback sr-only" role="status" aria-live="polite"></div>
            <div id="workbenchStatus" class="workbench-status sr-only" role="status" aria-live="polite">候補を選択して比較を開始できます</div>
          </section>
        </div>

        <div id="hitsoundGrid" data-active-side="don" aria-label="音源一覧">
          <section id="customSoundSection" class="hs-family hs-custom-family" aria-label="ユーザー音源">
            <div class="hs-family-title hs-custom-title">
              <span>My Sound</span>
              <span id="customSoundCount" aria-live="polite">0 / 8</span>
            </div>
            <div id="customSoundSlots" class="custom-sound-grid" aria-busy="true"></div>
            <p id="mySoundStatus" class="inline-status" role="status" aria-live="polite">WAV・8MB以下・5秒以下</p>
          </section>
          <div id="hitsoundSources"></div>
        </div>
        <div id="recommendationLine" class="hs-recommendation sr-only">推奨：—</div>
      </div>
    </section>

    <aside id="auditionPanel" class="audition-panel panel" aria-label="譜面再生" tabindex="-1">
      <div class="dock-mini" aria-label="固定再生Dock">
        <button id="previewButton" class="mini-play" type="button" aria-label="曲を再生" aria-pressed="false" disabled><span>▶</span></button>
        <div class="mini-state" aria-hidden="true"></div>
        <button id="dockToggleButton" class="dock-toggle" type="button" aria-label="再生パネルを展開" aria-expanded="false" aria-controls="dockExpanded"><span class="dock-icon" aria-hidden="true"></span></button>
      </div>

      <div id="dockExpanded" class="dock-expanded">
        <div class="dock-heading">
          <button id="dockCollapseButton" class="dock-collapse" type="button" aria-label="再生パネルを収納"><span class="dock-icon" aria-hidden="true"></span></button>
        </div>

        <section class="editor-panel" aria-label="譜面再生">
          <div class="playback-timeline-stack">
            <div id="timelineViewport" class="timeline-viewport" aria-label="現在位置周辺のTaikoヒットポイント"></div>

            <div id="overviewViewport" class="overview-viewport" aria-label="曲全体のタイムライン">
              <canvas id="overviewStaticCanvas" class="overview-static" aria-hidden="true"></canvas>
              <canvas id="overviewCursorCanvas" class="overview-cursor" aria-hidden="true"></canvas>
            </div>

            <div class="seek-wrap">
              <label class="seek-label" for="seekBar">曲の位置</label>
              <input id="seekBar" class="seek-bar" type="range" min="0" max="1" step="0.001" value="0" aria-label="曲の位置" disabled>
            </div>
          </div>

          <div class="transport-row">
            <button id="playButton" class="play-button" type="button" aria-label="曲を再生" aria-pressed="false" disabled>▶</button>
          </div>

          <div class="music-volume-control" role="group" aria-label="Music Volume">
            <span class="music-volume-label">Music Volume</span>
            <div class="music-volume-options">
              <button class="music-volume-button" type="button" data-music-gain="0.65" aria-pressed="true">0.65</button>
              <button class="music-volume-button" type="button" data-music-gain="0.70" aria-pressed="false">0.70</button>
              <button class="music-volume-button" type="button" data-music-gain="0.75" aria-pressed="false">0.75</button>
              <button class="music-volume-button" type="button" data-music-gain="0.80" aria-pressed="false">0.80</button>
              <button class="music-volume-button" type="button" data-music-gain="0.85" aria-pressed="false">0.85</button>
            </div>
          </div>
        </section>

      </div>
    </aside>
    </div>

    <section id="errorCard" class="error-panel panel" role="alert" hidden>
      <strong>読み込みエラー</strong>
      <p id="errorMessage"></p>
    </section>
  </main>

  <audio id="samplePreviewAudio" preload="none"></audio>
  <script>
    (() => {
      const datasetVersion = 'current111-abc-v5-20260823';
      const versionKey = 'CreateSE:dataset-version';
      try {
        if (localStorage.getItem(versionKey) !== datasetVersion) {
          localStorage.setItem(versionKey, datasetVersion);
        }
      } catch {}
    })();
  </script>
  <script src="./vendor/jszip.min.js?v=3.10.1"></script>
  <script src="./candidates.js?v=3.0-current111-abc-v5"></script>
  <script src="./candidate-numbering.js?v=3.0"></script>
  <script src="./charts.js?v=0.7-20260830-intertwined"></script>
  <script src="./orientation-guard.js?v=1.0-fixed-device-orientation"></script>
  <script src="./app-v4.js?v=4.4-music-volume-five"></script>
  <script src="./object-timeline-v2.js?v=4.1-fixed-geometry-no-fade"></script>
  <script src="./hitsound-controller.js?v=4.3-custom8"></script>
  <script src="./hitsound-favorites.js?v=5.1-set30-favorite-union"></script>
  <script src="./favorite-slot-ui.js?v=5.0-max30-seed15"></script>
  <script src="./hitsound-grid.js?v=4.5-filename-label"></script>
  <script src="./workbench-ui.js?v=2.2-no-scroll-restore"></script>
  <script src="./chart-loader.js?v=0.7-no-force-cache"></script>
</body>
</html>
