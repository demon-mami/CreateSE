name: Replace fixed set from favorites

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-set-from-favorites-20260827.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Replace fixed set and lock regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          favorites_path = Path('hitsound-favorites.js')
          favorites = favorites_path.read_text()

          new_block = """  const PRESET_MAX_ITEMS = 30;
  const PRESET_PAIRS = Object.freeze([
    ['P01', 'SRC051', 'SRC052'],
    ['P02', 'SRC116', 'SRC092'],
    ['P03', 'SRC072', 'SRC073'],
    ['P04', 'SRC071', 'SRC073'],
    ['P05', 'SRC066', 'SRC069'],
    ['P06', 'SRC069', 'SRC107'],
    ['P07', 'SRC070', 'SRC101'],
    ['P08', 'SRC006', 'SRC007'],
    ['P09', 'SRC025', 'SRC026'],
    ['P10', 'SRC043', 'SRC047'],
    ['P11', 'SRC107', 'SRC101'],
    ['P12', 'SRC006', 'SRC003'],
  ]);"""

          favorites, n = re.subn(
              r"  const PRESET_PAIRS = Object\.freeze\(\[\n.*?\n  \]\);",
              new_block,
              favorites,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise RuntimeError('PRESET_PAIRS block replacement failed')

          old = "    return PRESET_PAIRS.map(([pairId, donId, katId]) => ({"
          new = "    return PRESET_PAIRS.slice(0, PRESET_MAX_ITEMS).map(([pairId, donId, katId]) => ({"
          if old not in favorites:
              raise RuntimeError('presetEntries map line not found')
          favorites = favorites.replace(old, new, 1)

          old = "  window.HitsoundFavorites = {\n    KEY: SLOT_STORAGE_KEY,"
          new = "  window.HitsoundFavorites = {\n    KEY: SLOT_STORAGE_KEY,\n    MAX_PRESETS: PRESET_MAX_ITEMS,"
          if old not in favorites:
              raise RuntimeError('HitsoundFavorites export block not found')
          favorites = favorites.replace(old, new, 1)
          favorites_path.write_text(favorites)

          index_path = Path('index.html')
          index = index_path.read_text()
          old_cache = 'hitsound-favorites.js?v=5.0-preset-slots'
          new_cache = 'hitsound-favorites.js?v=5.1-set30-favorite-union'
          if old_cache not in index:
              raise RuntimeError('old hitsound-favorites cache key not found')
          index_path.write_text(index.replace(old_cache, new_cache, 1))

          test_path = Path('tests/workbench-static.test.mjs')
          tests = test_path.read_text()
          tests = tests.replace(
              "test('Current111 and fixed Pair-12 presets remain intact', () => {",
              "test('Current111 and favorite-derived fixed sets remain intact', () => {",
              1,
          )

          old_pairs = """  const expected = [
    ['P01','SRC070','SRC084'], ['P02','SRC015','SRC019'], ['P03','SRC098','SRC101'],
    ['P04','SRC098','SRC064'], ['P05','SRC056','SRC084'], ['P06','SRC070','SRC019'],
    ['P07','SRC089','SRC064'], ['P08','SRC089','SRC088'], ['P09','SRC101','SRC090'],
    ['P10','SRC056','SRC077'], ['P11','SRC084','SRC090'], ['P12','SRC079','SRC100'],
  ];"""
          new_pairs = """  const expected = [
    ['P01','SRC051','SRC052'], ['P02','SRC116','SRC092'], ['P03','SRC072','SRC073'],
    ['P04','SRC071','SRC073'], ['P05','SRC066','SRC069'], ['P06','SRC069','SRC107'],
    ['P07','SRC070','SRC101'], ['P08','SRC006','SRC007'], ['P09','SRC025','SRC026'],
    ['P10','SRC043','SRC047'], ['P11','SRC107','SRC101'], ['P12','SRC006','SRC003'],
  ];"""
          if old_pairs not in tests:
              raise RuntimeError('old Pair-12 regression block not found')
          tests = tests.replace(old_pairs, new_pairs, 1)

          marker = "  assert.match(grid, /data-abc=\"\\$\\{abcGrade\\}\"/);\n"
          addition = (
              marker
              + "  assert.match(favorites, /const PRESET_MAX_ITEMS = 30;/);\n"
              + "  assert.match(favorites, /PRESET_PAIRS\\.slice\\(0, PRESET_MAX_ITEMS\\)/);\n"
          )
          if marker not in tests:
              raise RuntimeError('preset regression insertion marker not found')
          tests = tests.replace(marker, addition, 1)

          runtime_marker = "  assert.match(html, /hitsound-controller\\.js\\?v=4\\.2-direct-only/);\n"
          runtime_addition = runtime_marker + "  assert.match(html, /hitsound-favorites\\.js\\?v=5\\.1-set30-favorite-union/);\n"
          if runtime_marker not in tests:
              raise RuntimeError('runtime cache marker not found')
          tests = tests.replace(runtime_marker, runtime_addition, 1)

          test_path.write_text(tests)
          PY

          node --test tests/workbench-static.test.mjs

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hitsound-favorites.js index.html tests/workbench-static.test.mjs
          git commit -m 'Replace fixed sets with deduplicated favorites'
          git push
