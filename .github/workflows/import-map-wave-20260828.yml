name: Import verified replacement maps 20260828

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-map-wave-20260828.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download source beatmapsets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/map-source
          download_set() {
            local id="$1"
            local out="/tmp/map-source/${id}.osz"
            if curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
              "https://mirror.hinamizawa.ai/api/v1/hinai/d/${id}" -o "$out"; then
              return 0
            fi
            rm -f "$out"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
              "https://catboy.best/d/${id}" -o "$out"
          }
          download_set 2140809
          download_set 1977658
          download_set 895400

      - name: Verify against uploaded sources and build minimal OSZ files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, zipfile

          specs = [
              {
                  'setid': '2140809',
                  'version': "Burakonine's Tale of Greed",
                  'osu_sha256': '6b87dd6bddc3bb491e45f88a175e1b33b2e1f7af21c51f8910e66e026a431786',
                  'audio_sha256': '0c9c00b1500b7b28ebe104847388e819aa64b62e68ffea83237887a695f67479',
                  'output': 'elna-dia.osz',
              },
              {
                  'setid': '1977658',
                  'version': '^^ 1.13x',
                  'osu_sha256': '910a0b4aa7f4c802992e46d794d6050259bf82ab40455eeb5656209d94929ab5',
                  'audio_sha256': '7b82aac1f4a385faf0a776c2d894b5588ceb71584cbc168ab0224947b683f75c',
                  'output': 'kaeru.osz',
              },
              {
                  'setid': '895400',
                  'version': 'Inner Oni',
                  'osu_sha256': '6f5fff3ec48407754c5321726f3ee703c41753ca1685d42a848e475ba4538e44',
                  'audio_sha256': 'd1dd0d398984518bbf92babdf3e19ecb83d57d0925ec5ec42cd7f497179744fa',
                  'output': 'dream-vandalism.osz',
              },
          ]

          source_dir = Path('/tmp/map-source')
          out_dir = Path('/tmp/map-minimal')
          out_dir.mkdir(parents=True, exist_ok=True)

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          for spec in specs:
              source = source_dir / f"{spec['setid']}.osz"
              with zipfile.ZipFile(source) as src:
                  selected = None
                  for name in src.namelist():
                      if not name.lower().endswith('.osu'):
                          continue
                      data = src.read(name)
                      text = data.decode('utf-8-sig', errors='replace')
                      mode = re.search(r'^Mode:(.*)$', text, re.M)
                      version = re.search(r'^Version:(.*)$', text, re.M)
                      if mode and mode.group(1).strip() == '1' and version and version.group(1).strip() == spec['version']:
                          selected = (name, data, text)
                          break
                  if selected is None:
                      raise RuntimeError(f"{spec['setid']}: target difficulty not found: {spec['version']}")

                  osu_name, osu_bytes, osu_text = selected
                  if sha256(osu_bytes) != spec['osu_sha256']:
                      raise RuntimeError(f"{spec['setid']}: osu content differs from uploaded source")

                  audio_match = re.search(r'^AudioFilename:(.*)$', osu_text, re.M)
                  if not audio_match:
                      raise RuntimeError(f"{spec['setid']}: AudioFilename missing")
                  audio_name = audio_match.group(1).strip()
                  audio_bytes = src.read(audio_name)
                  if sha256(audio_bytes) != spec['audio_sha256']:
                      raise RuntimeError(f"{spec['setid']}: audio differs from uploaded source")

                  target = out_dir / spec['output']
                  with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_STORED) as dst:
                      dst.writestr(osu_name, osu_bytes)
                      dst.writestr(audio_name, audio_bytes)
                  print(f"verified {spec['setid']} -> {target.name}: {spec['version']}")

          bundle = Path('/tmp/maps-wave-20260828.zip')
          with zipfile.ZipFile(bundle, 'w', compression=zipfile.ZIP_STORED) as z:
              for spec in specs:
                  path = out_dir / spec['output']
                  z.write(path, arcname=path.name)
          print('bundle', bundle, bundle.stat().st_size, sha256(bundle.read_bytes()))
          PY

      - name: Split and commit verified bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -f .map-assets/maps-wave-20260828-*.part .map-assets/maps-wave-20260828.sha256
          split -b 785000 -d -a 3 --additional-suffix=.part /tmp/maps-wave-20260828.zip .map-assets/maps-wave-20260828-
          HASH="$(sha256sum /tmp/maps-wave-20260828.zip | awk '{print $1}')"
          printf '%s  maps-wave-20260828.zip\n' "$HASH" > .map-assets/maps-wave-20260828.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .map-assets/maps-wave-20260828-*.part .map-assets/maps-wave-20260828.sha256
          git commit -m 'Add verified 20260828 replacement map assets'
          git push
