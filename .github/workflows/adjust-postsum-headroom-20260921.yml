name: Adjust post-sum audio headroom 20260921

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adjust-postsum-headroom-20260921.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply post-sum headroom design
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/update.py
          python /tmp/update.py
          node --test tests/workbench-static.test.mjs

      - name: Commit audio headroom update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v4.js index.html tests/workbench-static.test.mjs
          git commit -m 'Move final mix to 30 percent master headroom'
          git push
