name: Add My Sound replace control v2 20260828

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-my-sound-replace-v2-20260828.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add replace action to occupied My Sound slots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          p = Path('hitsound-grid.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '  let uploadTargetSlot = null;\n', '  let uploadTargetSlot = null;\n  let uploadReplace = false;\n', 'upload mode state')

          old_render = """        soundButton.append(soundFace);\n\n        item.append(soundButton);"""
          new_render = """        soundButton.append(soundFace);\n\n        const replaceButton = document.createElement('button');\n        replaceButton.type = 'button';\n        replaceButton.className = 'hs-key custom-sound-replace';\n        replaceButton.dataset.replaceSlot = String(slot);\n        replaceButton.disabled = customBusy;\n        replaceButton.title = `${record.sourceNumber} ${record.name} を変更`;\n        replaceButton.setAttribute('aria-label', `${record.sourceNumber} ${record.name} を別のWAVへ変更`);\n        const replaceFace = document.createElement('span');\n        replaceFace.textContent = '↻';\n        replaceButton.append(replaceFace);\n\n        item.append(soundButton, replaceButton);"""
          s = replace_once(s, old_render, new_render, 'replace control render')

          old_request = """  function requestCustomUpload(slot) {\n    if (!customReady || customBusy || slot < 1 || slot > CUSTOM_SLOT_COUNT) return;\n    if (customRecords.has(customIdForSlot(slot))) return;\n    uploadTargetSlot = slot;\n    customInput.value = '';\n    setCustomStatus(`My Sound ${slot} に追加するWAVを選択してください`);\n    customInput.click();\n  }"""
          new_request = """  function requestCustomUpload(slot, { replace = false } = {}) {\n    if (!customReady || customBusy || slot < 1 || slot > CUSTOM_SLOT_COUNT) return;\n    const id = customIdForSlot(slot);\n    const occupied = customRecords.has(id);\n    if (replace ? !occupied : occupied) return;\n    uploadTargetSlot = slot;\n    uploadReplace = replace;\n    customInput.value = '';\n    setCustomStatus(replace\n      ? `My Sound ${slot} を変更するWAVを選択してください`\n      : `My Sound ${slot} に追加するWAVを選択してください`);\n    customInput.click();\n  }"""
          s = replace_once(s, old_request, new_request, 'request upload mode')

          start = s.find('  async function addCustomSound(file, slot) {')
          end = s.find('\n  function setActiveSide(side) {', start)
          if start < 0 or end < 0:
              raise RuntimeError('addCustomSound block not found')
          replacement = """  async function saveCustomSound(file, slot, { replace = false } = {}) {\n    const id = customIdForSlot(slot);\n    const existing = customRecords.get(id) || null;\n    if (!file || customBusy || (replace ? !existing : !!existing)) return;\n\n    customBusy = true;\n    renderCustomSlots();\n    let record = null;\n    let persistenceError = null;\n\n    try {\n      await validateCustomSound(file);\n      const bytes = await file.arrayBuffer();\n      const fingerprint = await fingerprintBytes(bytes);\n      record = controller.registerCustomSource(id, {\n        id,\n        slot,\n        sourceNumber: `M${slot}`,\n        name: file.name,\n        type: file.type,\n        lastModified: file.lastModified,\n        size: file.size,\n        fingerprint,\n        bytes,\n      });\n      customRecords.set(id, record);\n      try {\n        await writeCustomRecord(record);\n      } catch (error) {\n        persistenceError = error;\n        console.warn('ユーザー音源をブラウザに保存できませんでした。', error);\n      }\n      setCustomStatus(`${record.sourceNumber} ${record.name} を${replace ? '変更' : '追加'}しました`);\n    } catch (error) {\n      if (record) {\n        if (replace && existing) {\n          const restored = controller.registerCustomSource(id, existing);\n          customRecords.set(id, restored);\n        } else {\n          customRecords.delete(id);\n          await controller.unregisterCustomSource(id).catch(() => {});\n        }\n      }\n      setCustomStatus(error instanceof Error ? error.message : `音源を${replace ? '変更' : '追加'}できませんでした。`, { error: true });\n      throw error;\n    } finally {\n      customBusy = false;\n      renderCustomSlots();\n      paint();\n    }\n\n    if (persistenceError) {\n      setCustomStatus(replace\n        ? '変更した音源は現在使用できますが保存できませんでした。次回起動時は以前の音源に戻ります。'\n        : '音源は使用できますが保存できませんでした。次回は再追加してください。', { error: true });\n    }\n\n    if (replace) {\n      const selection = controller.getSelection();\n      if (selection.don === id || selection.kat === id) {\n        try {\n          await controller.applyPair();\n        } catch (error) {\n          setCustomStatus(`音源は変更しましたが再生側へ反映できませんでした。${error.message}`, { error: true });\n        }\n      }\n    } else {\n      try {\n        await chooseSound(id, { preview: false });\n      } catch (error) {\n        setCustomStatus(`音源は追加しましたが選択を反映できませんでした。${error.message}`, { error: true });\n      }\n    }\n    window.dispatchEvent(new CustomEvent('hitsound-custom-sources-change'));\n  }\n"""
          s = s[:start] + replacement + s[end:]

          old_click = """  customSlots.addEventListener('click', event => {\n    if (customBusy || !customReady) return;\n\n    const addButton = event.target.closest('[data-upload-slot]');"""
          new_click = """  customSlots.addEventListener('click', event => {\n    if (customBusy || !customReady) return;\n\n    const replaceButton = event.target.closest('[data-replace-slot]');\n    if (replaceButton && customSlots.contains(replaceButton)) {\n      requestCustomUpload(Number(replaceButton.dataset.replaceSlot), { replace: true });\n      return;\n    }\n\n    const addButton = event.target.closest('[data-upload-slot]');"""
          s = replace_once(s, old_click, new_click, 'replace click handler')

          old_change = """  customInput.addEventListener('change', () => {\n    const file = customInput.files?.[0] || null;\n    const slot = uploadTargetSlot;\n    uploadTargetSlot = null;\n    customInput.value = '';\n    if (!slot) return;\n    if (!file) {\n      setCustomStatus('音源の追加をキャンセルしました');\n      return;\n    }\n    setCustomStatus(`${file.name} を確認しています…`);\n    addCustomSound(file, slot).catch(() => {});\n  });\n  customInput.addEventListener('cancel', () => {\n    uploadTargetSlot = null;\n    setCustomStatus('音源の追加をキャンセルしました');\n  });"""
          new_change = """  customInput.addEventListener('change', () => {\n    const file = customInput.files?.[0] || null;\n    const slot = uploadTargetSlot;\n    const replace = uploadReplace;\n    uploadTargetSlot = null;\n    uploadReplace = false;\n    customInput.value = '';\n    if (!slot) return;\n    if (!file) {\n      setCustomStatus(`音源の${replace ? '変更' : '追加'}をキャンセルしました`);\n      return;\n    }\n    setCustomStatus(`${file.name} を確認しています…`);\n    saveCustomSound(file, slot, { replace }).catch(() => {});\n  });\n  customInput.addEventListener('cancel', () => {\n    const replace = uploadReplace;\n    uploadTargetSlot = null;\n    uploadReplace = false;\n    setCustomStatus(`音源の${replace ? '変更' : '追加'}をキャンセルしました`);\n  });"""
          s = replace_once(s, old_change, new_change, 'input replace mode')

          for required in ['replaceButton.dataset.replaceSlot = String(slot)', 'saveCustomSound(file, slot, { replace = false } = {})', 'controller.applyPair()', 'requestCustomUpload(Number(replaceButton.dataset.replaceSlot), { replace: true })']:
              if required not in s:
                  raise RuntimeError(f'missing replacement behavior: {required}')
          for forbidden in ['data-delete-custom', 'custom-sound-delete', 'deleteCustomRecord', 'removeCustomSound']:
              if forbidden in s:
                  raise RuntimeError(f'delete behavior returned unexpectedly: {forbidden}')
          p.write_text(s, encoding='utf-8')

          p = Path('hitsound-grid.css')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '.custom-sound-key>span{padding:0 6px}', '.custom-sound-key>span{padding:0 27px 0 6px}', 'replace button space')
          marker = ".custom-sound-add>span{\n  border-style:dashed;\n  color:rgba(255,255,255,.55);\n  font-size:15px;\n}\n"
          addition = marker + ".custom-sound-grid .custom-sound-replace{\n  position:absolute;\n  top:0;\n  right:0;\n  z-index:4;\n  width:27px;\n  min-width:27px;\n  padding:0 0 4px;\n}\n.custom-sound-replace::before{display:none}\n.custom-sound-replace>span{\n  height:30px;\n  border:0;\n  border-radius:0 10px 10px 0;\n  background:rgba(255,255,255,.035);\n  box-shadow:inset 1px 0 rgba(255,255,255,.09);\n  color:rgba(255,255,255,.58);\n  font-size:13px;\n}\n.custom-sound-replace:active>span{\n  background:rgba(255,255,255,.095);\n  color:rgba(255,255,255,.92);\n}\n.custom-sound-key.selected-don + .custom-sound-replace>span,\n.custom-sound-key.selected-kat + .custom-sound-replace>span{transform:translateY(4px)}\n.custom-sound-key.selected-don + .custom-sound-replace>span{color:#8b3440}\n.custom-sound-key.selected-kat + .custom-sound-replace>span{color:#326c85}\n.custom-sound-key.selected-don.selected-kat + .custom-sound-replace>span{color:#594f58}\n"
          s = replace_once(s, marker, addition, 'replace button css')
          s = replace_once(s, '  .custom-sound-key>span{padding-inline:5px}', '  .custom-sound-key>span{padding:0 25px 0 5px}\n  .custom-sound-grid .custom-sound-replace{width:25px;min-width:25px}', 'phone replace spacing')
          if 'custom-sound-delete' in s:
              raise RuntimeError('delete css returned unexpectedly')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, './hitsound-grid.css?v=4.4-my-sound-8', './hitsound-grid.css?v=4.5-my-sound-replace', 'css cache')
          s = replace_once(s, './hitsound-grid.js?v=4.3-my-sound-8', './hitsound-grid.js?v=4.4-my-sound-replace', 'js cache')
          p.write_text(s, encoding='utf-8')

          p = Path('tests/workbench-static.test.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('hitsound-grid\\.css\\?v=4\\.4-my-sound-8', 'hitsound-grid\\.css\\?v=4\\.5-my-sound-replace')
          s = s.replace('hitsound-grid\\.js\\?v=4\\.3-my-sound-8', 'hitsound-grid\\.js\\?v=4\\.4-my-sound-replace')
          old_assert = "  assert.doesNotMatch(gridCss, /custom-sound-delete/);\n"
          new_assert = old_assert + "  assert.match(grid, /replaceButton\\.dataset\\.replaceSlot = String\\(slot\\)/);\n  assert.match(grid, /requestCustomUpload\\(Number\\(replaceButton\\.dataset\\.replaceSlot\\), \\{ replace: true \\}\\)/);\n  assert.match(grid, /async function saveCustomSound\\(file, slot, \\{ replace = false \\} = \\{\\}\\)/);\n  assert.match(grid, /if \\(replace\\) \\{[\\s\\S]*?controller\\.applyPair\\(\\)/);\n  assert.match(gridCss, /custom-sound-replace/);\n"
          s = replace_once(s, old_assert, new_assert, 'replace regression assertions')
          p.write_text(s, encoding='utf-8')
          PY

          node --test tests/workbench-static.test.mjs

      - name: Commit replace support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hitsound-grid.js hitsound-grid.css index.html tests/workbench-static.test.mjs
          git commit -m 'Allow replacing registered My Sound slots'
          git push
