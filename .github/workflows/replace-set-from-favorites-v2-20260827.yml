name: Replace fixed set from favorites v2

on:
  push:
    branches:
      - main
    paths:
      - .set-replace-trigger

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update source and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          f = Path('hitsound-favorites.js')
          s = f.read_text()
          pairs = [
              ('P01','SRC051','SRC052'),
              ('P02','SRC116','SRC092'),
              ('P03','SRC072','SRC073'),
              ('P04','SRC071','SRC073'),
              ('P05','SRC066','SRC069'),
              ('P06','SRC069','SRC107'),
              ('P07','SRC070','SRC101'),
              ('P08','SRC006','SRC007'),
              ('P09','SRC025','SRC026'),
              ('P10','SRC043','SRC047'),
              ('P11','SRC107','SRC101'),
              ('P12','SRC006','SRC003'),
          ]
          block_lines = ['  const PRESET_MAX_ITEMS = 30;', '  const PRESET_PAIRS = Object.freeze([']
          block_lines += [f"    ['{label}', '{don}', '{kat}']," for label, don, kat in pairs]
          block_lines += ['  ]);']
          block = '\n'.join(block_lines)
          s, n = re.subn(r"  const PRESET_PAIRS = Object\.freeze\(\[\n.*?\n  \]\);", block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('PRESET_PAIRS replace failed')
          s = s.replace('    return PRESET_PAIRS.map(([pairId, donId, katId]) => ({', '    return PRESET_PAIRS.slice(0, PRESET_MAX_ITEMS).map(([pairId, donId, katId]) => ({', 1)
          s = s.replace('  window.HitsoundFavorites = {\n    KEY: SLOT_STORAGE_KEY,', '  window.HitsoundFavorites = {\n    KEY: SLOT_STORAGE_KEY,\n    MAX_PRESETS: PRESET_MAX_ITEMS,', 1)
          f.write_text(s)

          f = Path('index.html')
          s = f.read_text()
          old = 'hitsound-favorites.js?v=5.0-preset-slots'
          if old not in s:
              raise SystemExit('cache key replace failed')
          f.write_text(s.replace(old, 'hitsound-favorites.js?v=5.1-set30-favorite-union', 1))

          f = Path('tests/workbench-static.test.mjs')
          s = f.read_text()
          s = s.replace("test('Current111 and fixed Pair-12 presets remain intact', () => {", "test('Current111 and favorite-derived fixed sets remain intact', () => {", 1)
          old_expected = "\n".join([
              "  const expected = [",
              "    ['P01','SRC070','SRC084'], ['P02','SRC015','SRC019'], ['P03','SRC098','SRC101'],",
              "    ['P04','SRC098','SRC064'], ['P05','SRC056','SRC084'], ['P06','SRC070','SRC019'],",
              "    ['P07','SRC089','SRC064'], ['P08','SRC089','SRC088'], ['P09','SRC101','SRC090'],",
              "    ['P10','SRC056','SRC077'], ['P11','SRC084','SRC090'], ['P12','SRC079','SRC100'],",
              "  ];",
          ])
          new_expected = "\n".join([
              "  const expected = [",
              "    ['P01','SRC051','SRC052'], ['P02','SRC116','SRC092'], ['P03','SRC072','SRC073'],",
              "    ['P04','SRC071','SRC073'], ['P05','SRC066','SRC069'], ['P06','SRC069','SRC107'],",
              "    ['P07','SRC070','SRC101'], ['P08','SRC006','SRC007'], ['P09','SRC025','SRC026'],",
              "    ['P10','SRC043','SRC047'], ['P11','SRC107','SRC101'], ['P12','SRC006','SRC003'],",
              "  ];",
          ])
          if old_expected not in s:
              raise SystemExit('expected pair block replace failed')
          s = s.replace(old_expected, new_expected, 1)
          marker = '  assert.match(grid, /data-abc="\\$\\{abcGrade\\}"/);\n'
          if marker not in s:
              raise SystemExit('set max marker missing')
          s = s.replace(marker, marker + '  assert.match(favorites, /const PRESET_MAX_ITEMS = 30;/);\n  assert.match(favorites, /PRESET_PAIRS\\.slice\\(0, PRESET_MAX_ITEMS\\)/);\n', 1)
          marker = '  assert.match(html, /hitsound-controller\\.js\\?v=4\\.2-direct-only/);\n'
          if marker not in s:
              raise SystemExit('runtime marker missing')
          s = s.replace(marker, marker + '  assert.match(html, /hitsound-favorites\\.js\\?v=5\\.1-set30-favorite-union/);\n', 1)
          f.write_text(s)
          PY

          node --test tests/workbench-static.test.mjs

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hitsound-favorites.js index.html tests/workbench-static.test.mjs
          git commit -m 'Replace fixed sets with deduplicated favorites'
          git push
