name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hitsound Lab
        uses: actions/checkout@v6

      - name: Checkout frozen reference vendor
        uses: actions/checkout@v6
        with:
          repository: demon-mami/osutaiko-mami-viewer
          ref: c22e29e4ce9cd8ae8c7a5ec3f2c4c9388c6b66c9
          path: _reference

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare site
        run: |
          mkdir -p _site/vendor _site/maps
          cp index.html _site/
          cp qa-iphone.html _site/
          cp style.css _site/
          cp theme-col07.css _site/
          cp hitsound-grid.css _site/
          cp workbench.css _site/
          cp candidates.js _site/
          cp candidate-numbering.js _site/
          cp charts.js _site/
          cp chart-loader.js _site/
          cp app-v4.js _site/
          cp hitsound-controller.js _site/
          cp hitsound-favorites.js _site/
          cp favorite-slot-ui.js _site/
          cp favorite-pager-v4.js _site/
          cp hitsound-grid.js _site/
          cp workbench-ui.js _site/
          cp object-timeline-v2.js _site/
          cp hitsounds-current111-abc-v5.zip _site/
          cp maps.zip _site/

          # Rebuild the added map bundle, verify it, then publish each OSZ separately.
          cat .map-assets/maps-added-*.part > /tmp/maps-added.zip
          (cd /tmp && sha256sum -c "$GITHUB_WORKSPACE/.map-assets/maps-added.sha256")
          unzip -q /tmp/maps-added.zip -d _site/maps

          # Keep only the verified JSZip vendor file from the frozen Viewer reference.
          cp _reference/vendor/jszip.min.js _site/vendor/jszip.min.js

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
