name: Finalize Onii-chan rotation 20260830

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-oniichan-rotation-20260830.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rotate KAERU to Onii-chan and run regressions
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/finalize.py
          python /tmp/finalize.py
          node --test tests/workbench-static.test.mjs

      - name: Commit chart rotation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add charts.js index.html tests/workbench-static.test.mjs
          git commit -m 'Replace KAERU with Onii-chan map'
          git push
