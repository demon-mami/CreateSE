name: Import verified Onii-chan map v4 official pack 20260830

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-oniichan-map-v4-20260830.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download official taiko pack ST254
        shell: bash
        run: |
          set -euo pipefail
          PACK=/tmp/ST254.zip
          PAGE=/tmp/ST254.html
          URL=""
          if curl -fsSL --connect-timeout 10 --max-time 30 "https://osu.ppy.sh/beatmaps/packs/ST254" -o "$PAGE"; then
            URL="$(python - <<'PY'
          import html, re
          text = open('/tmp/ST254.html', encoding='utf-8', errors='ignore').read()
          matches = re.findall(r'https://packs\.ppy\.sh/[^\"\'<> ]+', text)
          print(html.unescape(matches[0]) if matches else '')
          PY
          )"
          fi
          if [ -z "$URL" ]; then
            URL='https://packs.ppy.sh/ST254%20-%20osu%21taiko%20Beatmap%20Pack%20%23254.zip'
          fi
          echo "pack_url=$URL"
          curl -fL --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 360 "$URL" -o "$PACK"
          unzip -tq "$PACK"

      - name: Extract target OSZ and verify against uploaded source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import hashlib, re, zipfile

          pack = Path('/tmp/ST254.zip')
          output = Path('/tmp/onii-chan-migite-kinshi.osz')
          expected_version = 'Cute Sisters -Full-'
          expected_title_unicode = 'お兄ちゃん、右手の使用を禁止します！ (TamolarM Bootleg Remix)'
          expected_osu = '859b779218ac8ac8eb2c7456a30f25ed05ee54fc215841c7e1645bd30c2eec54'
          expected_audio = '900b4ab5b9e76261e339ae17fe0850e3698471ce58861a442b76eb304a3805ac'
          def sha(data): return hashlib.sha256(data).hexdigest()

          with zipfile.ZipFile(pack) as pz:
              candidates = [n for n in pz.namelist() if n.lower().endswith('.osz') and ('Onii-chan' in n or 'Migite' in n)]
              if len(candidates) != 1:
                  raise RuntimeError(f'expected one target OSZ in ST254, found {candidates}')
              source_bytes = pz.read(candidates[0])

          with zipfile.ZipFile(BytesIO(source_bytes)) as src:
              selected = None
              for name in src.namelist():
                  if not name.lower().endswith('.osu'): continue
                  data = src.read(name)
                  text = data.decode('utf-8-sig', errors='replace')
                  mode = re.search(r'^Mode:(.*)$', text, re.M)
                  version = re.search(r'^Version:(.*)$', text, re.M)
                  title_unicode = re.search(r'^TitleUnicode:(.*)$', text, re.M)
                  if mode and mode.group(1).strip() == '1' and version and version.group(1).strip() == expected_version:
                      if not title_unicode or title_unicode.group(1).strip() != expected_title_unicode:
                          raise RuntimeError('target TitleUnicode differs from uploaded source')
                      selected = (name, data, text)
                      break
              if selected is None: raise RuntimeError('target difficulty Cute Sisters -Full- not found')
              osu_name, osu_bytes, osu_text = selected
              if sha(osu_bytes) != expected_osu: raise RuntimeError('target osu content differs from uploaded source')
              match = re.search(r'^AudioFilename:(.*)$', osu_text, re.M)
              if not match: raise RuntimeError('AudioFilename missing')
              audio_name = match.group(1).strip()
              audio_bytes = src.read(audio_name)
              if sha(audio_bytes) != expected_audio: raise RuntimeError('audio differs from uploaded source')
              with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_STORED) as dst:
                  dst.writestr(osu_name, osu_bytes)
                  dst.writestr(audio_name, audio_bytes)

          bundle = Path('/tmp/maps-wave-20260830-oniichan.zip')
          with zipfile.ZipFile(bundle, 'w', compression=zipfile.ZIP_STORED) as z:
              z.write(output, arcname='onii-chan-migite-kinshi.osz')
          print('verified', output.name, output.stat().st_size)
          print('bundle_sha256', sha(bundle.read_bytes()))
          PY

      - name: Split and commit verified bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -f .map-assets/maps-wave-20260830-oniichan-*.part .map-assets/maps-wave-20260830-oniichan.sha256
          split -b 785000 -d -a 3 --additional-suffix=.part /tmp/maps-wave-20260830-oniichan.zip .map-assets/maps-wave-20260830-oniichan-
          HASH="$(sha256sum /tmp/maps-wave-20260830-oniichan.zip | awk '{print $1}')"
          printf '%s  maps-wave-20260830-oniichan.zip\n' "$HASH" > .map-assets/maps-wave-20260830-oniichan.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .map-assets/maps-wave-20260830-oniichan-*.part .map-assets/maps-wave-20260830-oniichan.sha256
          git commit -m 'Add verified Onii-chan map asset'
          git push
