name: Expand My Sound to 8 slots v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/expand-my-sound-8-v2-20260828.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Expand My Sound and remove delete UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          p = Path('hitsound-controller.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, "  const CUSTOM_ID_PATTERN = /^__CUSTOM_[1-4]__$/;", "  const CUSTOM_ID_PATTERN = /^__CUSTOM_[1-8]__$/;", 'controller custom id pattern')
          p.write_text(s, encoding='utf-8')

          p = Path('hitsound-grid.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '  const CUSTOM_SLOT_COUNT = 4;', '  const CUSTOM_SLOT_COUNT = 8;', 'custom slot count')
          s, n = re.subn(r"\n  async function deleteCustomRecord\(id\) \{.*?\n  \}\n\n  function renderCustomSlots\(\)", "\n  function renderCustomSlots()", s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError('deleteCustomRecord removal failed')
          s, n = re.subn(r"\n        const deleteButton = document\.createElement\('button'\);.*?\n        item\.append\(soundButton, deleteButton\);", "\n        item.append(soundButton);", s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError('custom delete button removal failed')
          s, n = re.subn(r"\n  async function removeCustomSound\(id\) \{.*?\n  \}\n\n  function setActiveSide\(side\)", "\n  function setActiveSide(side)", s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError('removeCustomSound removal failed')
          s, n = re.subn(r"\n    const deleteButton = event\.target\.closest\('\[data-delete-custom\]'\);.*?\n    const addButton = event\.target\.closest\('\[data-upload-slot\]'\);", "\n    const addButton = event.target.closest('[data-upload-slot]');", s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError('custom delete click handler removal failed')
          for forbidden in ['data-delete-custom', 'custom-sound-delete', 'deleteCustomRecord', 'removeCustomSound']:
              if forbidden in s:
                  raise RuntimeError(f'delete UI residue remains: {forbidden}')
          p.write_text(s, encoding='utf-8')

          p = Path('hitsound-grid.css')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '/* Four browser-local user sounds stay visible as one compact row. */', '/* Eight browser-local user sounds: one row on wide layouts, two balanced rows on iPhone. */', 'custom css comment')
          s = replace_once(s, '  grid-template-columns:repeat(4,minmax(0,1fr));', '  grid-template-columns:repeat(8,minmax(0,1fr));', 'custom wide columns')
          s = replace_once(s, '.custom-sound-key>span{padding:0 27px 0 5px}', '.custom-sound-key>span{padding:0 6px}', 'custom key padding')
          start = s.find('.custom-sound-grid .custom-sound-delete{')
          end_marker = '.custom-sound-key.selected-don + .custom-sound-delete:active>span,\n.custom-sound-key.selected-kat + .custom-sound-delete:active>span{transform:translateY(4px)}\n'
          if start < 0:
              raise RuntimeError('custom delete css start not found')
          end_start = s.find(end_marker, start)
          if end_start < 0:
              raise RuntimeError('custom delete css end not found')
          s = s[:start] + s[end_start + len(end_marker):]
          hover_block = "\n".join([
              '@media(hover:hover){',
              '  .custom-sound-delete:hover>span{',
              '    background:rgba(255,255,255,.055);',
              '    color:rgba(255,255,255,.78);',
              '    filter:none;',
              '  }',
              '}',
              '',
              '',
          ])
          if hover_block not in s:
              raise RuntimeError('custom delete hover block not found')
          s = s.replace(hover_block, '', 1)
          phone_old = "\n".join([
              '  .custom-sound-grid{gap:5px}',
              '  .custom-sound-grid .custom-sound-delete{width:27px;min-width:27px}',
              '  .custom-sound-key>span{padding-right:26px}',
              '',
          ])
          phone_new = "\n".join([
              '  .custom-sound-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}',
              '  .custom-sound-key>span{padding-inline:5px}',
              '',
          ])
          s = replace_once(s, phone_old, phone_new, 'phone custom layout')
          if 'custom-sound-delete' in s:
              raise RuntimeError('custom delete css residue remains')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, './hitsound-grid.css?v=4.3-pair-presets', './hitsound-grid.css?v=4.4-my-sound-8', 'grid css cache')
          s = replace_once(s, '>0 / 4</span>', '>0 / 8</span>', 'custom count')
          s = replace_once(s, './hitsound-controller.js?v=4.2-direct-only', './hitsound-controller.js?v=4.3-custom8', 'controller cache')
          s = replace_once(s, './hitsound-grid.js?v=4.2-no-delete-rating', './hitsound-grid.js?v=4.3-my-sound-8', 'grid js cache')
          p.write_text(s, encoding='utf-8')

          p = Path('tests/workbench-static.test.mjs')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, "const grid = read('hitsound-grid.js');\n", "const grid = read('hitsound-grid.js');\nconst gridCss = read('hitsound-grid.css');\n", 'grid css test import')
          marker = "test('chart rotations keep 15 maps and include the 20260828 replacements', () => {"
          new_test = "\n".join([
              "test('My Sound provides eight slots without delete controls', () => {",
              "  assert.match(html, /hitsound-grid\\.css\\?v=4\\.4-my-sound-8/);",
              "  assert.match(html, /id=\"customSoundCount\"[^>]*>0 \\/ 8<\\/span>/);",
              "  assert.ok(controller.includes('const CUSTOM_ID_PATTERN = /^__CUSTOM_[1-8]__$/;'));",
              "  assert.match(grid, /const CUSTOM_SLOT_COUNT = 8;/);",
              "  assert.doesNotMatch(grid, /data-delete-custom|custom-sound-delete|deleteCustomRecord|removeCustomSound/);",
              "  assert.doesNotMatch(gridCss, /custom-sound-delete/);",
              "  assert.match(gridCss, /grid-template-columns:repeat\\(8,minmax\\(0,1fr\\)\\)/);",
              "  assert.match(gridCss, /@media\\(max-width:430px\\)\\{[\\s\\S]*?\\.custom-sound-grid\\{grid-template-columns:repeat\\(4,minmax\\(0,1fr\\)\\);gap:5px\\}/);",
              '});',
              '',
              '',
          ])
          if marker not in s:
              raise RuntimeError('test insertion marker not found')
          s = s.replace(marker, new_test + marker, 1)
          s = replace_once(s, "  assert.match(html, /hitsound-controller\\.js\\?v=4\\.2-direct-only/);", "  assert.match(html, /hitsound-controller\\.js\\?v=4\\.3-custom8/);", 'controller runtime test cache')
          s = replace_once(s, "  assert.match(html, /favorite-slot-ui\\.js\\?v=5\\.0-max30-seed15/);", "  assert.match(html, /favorite-slot-ui\\.js\\?v=5\\.0-max30-seed15/);\n  assert.match(html, /hitsound-grid\\.js\\?v=4\\.3-my-sound-8/);", 'grid runtime test cache')
          p.write_text(s, encoding='utf-8')
          PY

          node --test tests/workbench-static.test.mjs

      - name: Commit My Sound expansion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hitsound-controller.js hitsound-grid.js hitsound-grid.css index.html tests/workbench-static.test.mjs
          git commit -m 'Expand My Sound to eight slots'
          git push
