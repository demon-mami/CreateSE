name: Import verified Shoujo Rei v2 20260831

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-shoujo-rei-v2-20260831.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download beatmapset from hinai
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 \
            "https://mirror.hinamizawa.ai/api/v1/hinai/d/1914426" -o /tmp/1914426.osz
          unzip -tq /tmp/1914426.osz

      - name: Verify exact uploaded-source bytes and build minimal OSZ
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, zipfile

          expected_osu = '358adaf0982eecf4d19d6fcc69f59d5f32380d0bf5b27fff4d7f53d0511661cb'
          expected_audio = 'f85ff24d135c73cdd60c333430dfae9672512b35cae8d4e2be31fbb0caaaebbd'
          expected_version = 'Hell Oni'
          expected_title_unicode = '少女レイ'
          def sha(data): return hashlib.sha256(data).hexdigest()

          with zipfile.ZipFile('/tmp/1914426.osz') as src:
              selected = None
              for name in src.namelist():
                  if not name.lower().endswith('.osu'): continue
                  data = src.read(name)
                  text = data.decode('utf-8-sig', errors='replace')
                  def field(key):
                      m = re.search(rf'^{re.escape(key)}:(.*)$', text, re.M)
                      return m.group(1).strip() if m else None
                  if field('Mode') == '1' and field('Version') == expected_version:
                      if field('TitleUnicode') != expected_title_unicode:
                          raise RuntimeError('TitleUnicode mismatch')
                      selected = (name, data, text)
                      break
              if selected is None: raise RuntimeError('Hell Oni not found')
              osu_name, osu_bytes, osu_text = selected
              if sha(osu_bytes) != expected_osu:
                  raise RuntimeError(f'osu differs from uploaded source: {sha(osu_bytes)}')
              m = re.search(r'^AudioFilename:(.*)$', osu_text, re.M)
              if not m: raise RuntimeError('AudioFilename missing')
              audio_name = m.group(1).strip()
              audio_bytes = src.read(audio_name)
              if sha(audio_bytes) != expected_audio:
                  raise RuntimeError(f'audio differs from uploaded source: {sha(audio_bytes)}')

          output = Path('/tmp/shoujo-rei.osz')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_STORED) as dst:
              dst.writestr(osu_name, osu_bytes)
              dst.writestr('audio.mp3', audio_bytes)
          bundle = Path('/tmp/maps-wave-20260831-shoujo-rei.zip')
          with zipfile.ZipFile(bundle, 'w', compression=zipfile.ZIP_STORED) as z:
              z.write(output, arcname='shoujo-rei.osz')
          print('verified_osu_sha256', sha(osu_bytes))
          print('verified_audio_sha256', sha(audio_bytes))
          print('bundle_sha256', sha(bundle.read_bytes()))
          PY

      - name: Split and commit verified bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -f .map-assets/maps-wave-20260831-shoujo-rei-*.part .map-assets/maps-wave-20260831-shoujo-rei.sha256
          split -b 785000 -d -a 3 --additional-suffix=.part /tmp/maps-wave-20260831-shoujo-rei.zip .map-assets/maps-wave-20260831-shoujo-rei-
          HASH="$(sha256sum /tmp/maps-wave-20260831-shoujo-rei.zip | awk '{print $1}')"
          printf '%s  maps-wave-20260831-shoujo-rei.zip\n' "$HASH" > .map-assets/maps-wave-20260831-shoujo-rei.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .map-assets/maps-wave-20260831-shoujo-rei-*.part .map-assets/maps-wave-20260831-shoujo-rei.sha256
          git commit -m 'Add verified Shoujo Rei map asset'
          git push
