name: Rotate title-only maps 20260926

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rotate-titleonly-next2-20260926.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rebuild verified rotation bundle
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/update.py
          python /tmp/update.py
      - name: Commit asset bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .map-assets/
          git commit -m 'Replace title-only map assets'
          git push
