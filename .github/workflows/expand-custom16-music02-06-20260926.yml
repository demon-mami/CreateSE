name: Expand My Sound and revise Music Volume 20260926

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/expand-custom16-music02-06-20260926.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply requested UI and storage changes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/update.py
          python /tmp/update.py
          node --test tests/workbench-static.test.mjs

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v4.js index.html hitsound-grid.js hitsound-grid.css hitsound-controller.js workbench.css tests/workbench-static.test.mjs
          git commit -m 'Expand My Sound to 16 and revise Music Volume steps'
          git push
