name: Add title-only maps 20260926

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-titleonly-maps-20260926.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build verified maps and update registry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/update.py
          python /tmp/update.py
          node --test tests/workbench-static.test.mjs

      - name: Commit title-only map rotation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add charts.js index.html chart-loader.js tests/workbench-static.test.mjs .map-assets/
          git commit -m 'Replace two registered maps with title-only entries'
          git push
