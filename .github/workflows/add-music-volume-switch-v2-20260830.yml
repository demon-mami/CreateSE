name: Add five-step Music Volume switch v2 20260830

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-music-volume-switch-v2-20260830.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add playback Music Volume switch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/update_music_volume.py
          python /tmp/update_music_volume.py
          node --test tests/workbench-static.test.mjs

      - name: Commit Music Volume switch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html workbench.css app-v4.js tests/workbench-static.test.mjs
          git commit -m 'Add five-step Music Volume switch'
          git push
