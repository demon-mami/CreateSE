name: Import Shuuten audio repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-shuuten-audio-fix-20260826.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download verified beatmapset source
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
            "https://mirror.hinamizawa.ai/api/v1/hinai/d/1651911" -o /tmp/shuuten-source.osz; then
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
              "https://catboy.best/d/1651911" -o /tmp/shuuten-source.osz
          fi

      - name: Strip malformed ID3 prefix without touching MPEG frames
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, zipfile

          SOURCE = Path('/tmp/shuuten-source.osz')
          OUT = Path('/tmp/shuuten-no-saki.osz')
          EXPECTED_OSU = 'ebc7deadd598856a5bd90ee39c9ff45d05e3e37dcb88da749e457c191aef3060'
          EXPECTED_AUDIO = '1f9ec6a66c0f10c1289d01eecbffe02039e8a1a2f0523d1739da7f85fad23b44'

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          with zipfile.ZipFile(SOURCE) as src:
              selected = None
              for name in src.namelist():
                  if not name.lower().endswith('.osu'):
                      continue
                  data = src.read(name)
                  text = data.decode('utf-8-sig', errors='replace')
                  mode = re.search(r'^Mode:(.*)$', text, re.M)
                  version = re.search(r'^Version:(.*)$', text, re.M)
                  if mode and mode.group(1).strip() == '1' and version and version.group(1).strip() == 'Finale Oni':
                      selected = (name, data, text)
                      break
              if selected is None:
                  raise RuntimeError('Finale Oni not found')

              osu_name, osu_bytes, osu_text = selected
              if sha(osu_bytes) != EXPECTED_OSU:
                  raise RuntimeError('Finale Oni .osu differs from uploaded source')

              audio_match = re.search(r'^AudioFilename:(.*)$', osu_text, re.M)
              if not audio_match:
                  raise RuntimeError('AudioFilename missing')
              audio_name = audio_match.group(1).strip()
              audio = src.read(audio_name)
              if sha(audio) != EXPECTED_AUDIO:
                  raise RuntimeError('audio differs from uploaded source')

              if audio[:3] != b'ID3':
                  raise RuntimeError('expected malformed ID3v2 prefix')
              tag_size = ((audio[6] & 0x7f) << 21) | ((audio[7] & 0x7f) << 14) | ((audio[8] & 0x7f) << 7) | (audio[9] & 0x7f)
              declared_end = 10 + tag_size
              start = None
              for i in range(declared_end, min(len(audio) - 1, declared_end + 4096)):
                  if audio[i] == 0xff and (audio[i + 1] & 0xe0) == 0xe0:
                      start = i
                      break
              if start != 148:
                  raise RuntimeError(f'unexpected first MPEG frame offset: {start}, declared ID3 end: {declared_end}')

              repaired = audio[start:]
              if not audio.endswith(repaired):
                  raise RuntimeError('MPEG frame stream was not preserved byte-for-byte')
              if repaired[:2] != audio[start:start+2]:
                  raise RuntimeError('MPEG frame header mismatch')

              with zipfile.ZipFile(OUT, 'w', compression=zipfile.ZIP_STORED) as dst:
                  dst.writestr(osu_name, osu_bytes)
                  dst.writestr(audio_name, repaired)

              print('declared ID3 end:', declared_end)
              print('first MPEG frame:', start)
              print('removed prefix bytes:', start)
              print('original audio sha256:', sha(audio))
              print('repaired audio sha256:', sha(repaired))
              print('repaired osz bytes:', OUT.stat().st_size)

          bundle = Path('/tmp/maps-shuuten-fix-20260826.zip')
          with zipfile.ZipFile(bundle, 'w', compression=zipfile.ZIP_STORED) as z:
              z.write(OUT, arcname='shuuten-no-saki.osz')
          print('bundle sha256:', sha(bundle.read_bytes()))
          PY

      - name: Split and commit repaired bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -f .map-assets/maps-shuuten-fix-20260826-*.part .map-assets/maps-shuuten-fix-20260826.sha256
          split -b 785000 -d -a 3 --additional-suffix=.part /tmp/maps-shuuten-fix-20260826.zip .map-assets/maps-shuuten-fix-20260826-
          HASH="$(sha256sum /tmp/maps-shuuten-fix-20260826.zip | awk '{print $1}')"
          printf '%s  maps-shuuten-fix-20260826.zip\n' "$HASH" > .map-assets/maps-shuuten-fix-20260826.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .map-assets/maps-shuuten-fix-20260826-*.part .map-assets/maps-shuuten-fix-20260826.sha256
          git commit -m 'Add repaired Shuuten map audio asset'
          git push
