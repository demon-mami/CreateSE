name: Import verified Onii-chan map v5 official sources 20260830

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-oniichan-map-v5-20260830.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download official target osu and taiko pack audio source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 60 "https://osu.ppy.sh/osu/3304251" -o /tmp/target.osu
          curl -fL --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 360 "https://packs.ppy.sh/ST254%20-%20osu%21taiko%20Beatmap%20Pack%20%23254.zip" -o /tmp/ST254.zip
          unzip -tq /tmp/ST254.zip

      - name: Verify exact bytes and build minimal OSZ
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import hashlib, re, zipfile

          target_osu = Path('/tmp/target.osu').read_bytes()
          expected_osu = '859b779218ac8ac8eb2c7456a30f25ed05ee54fc215841c7e1645bd30c2eec54'
          expected_audio = '900b4ab5b9e76261e339ae17fe0850e3698471ce58861a442b76eb304a3805ac'
          expected_version = 'Cute Sisters -Full-'
          expected_title_unicode = 'お兄ちゃん、右手の使用を禁止します！ (TamolarM Bootleg Remix)'
          archive_osu_name = 'Yakushi Ruri - Onii-chan, Migite no Shiyou o Kinshi Shimasu! (TamolarM Bootleg Remix) (K-2) [Cute Sisters -Full-].osu'
          def sha(data): return hashlib.sha256(data).hexdigest()

          if sha(target_osu) != expected_osu:
              raise RuntimeError(f'official BeatmapID 3304251 differs from uploaded osu: {sha(target_osu)}')
          text = target_osu.decode('utf-8-sig', errors='strict')
          mode = re.search(r'^Mode:(.*)$', text, re.M)
          version = re.search(r'^Version:(.*)$', text, re.M)
          title_unicode = re.search(r'^TitleUnicode:(.*)$', text, re.M)
          if not mode or mode.group(1).strip() != '1': raise RuntimeError('official target is not Mode 1')
          if not version or version.group(1).strip() != expected_version: raise RuntimeError('official target Version mismatch')
          if not title_unicode or title_unicode.group(1).strip() != expected_title_unicode: raise RuntimeError('official target TitleUnicode mismatch')

          with zipfile.ZipFile('/tmp/ST254.zip') as pack:
              candidates = [n for n in pack.namelist() if n.lower().endswith('.osz') and ('Onii-chan' in n or 'Migite' in n)]
              if len(candidates) != 1: raise RuntimeError(f'expected one song OSZ in ST254, found {candidates}')
              song_osz = pack.read(candidates[0])

          with zipfile.ZipFile(BytesIO(song_osz)) as src:
              audio_name = None
              for name in src.namelist():
                  if not name.lower().endswith('.osu'): continue
                  st = src.read(name).decode('utf-8-sig', errors='replace')
                  match = re.search(r'^AudioFilename:(.*)$', st, re.M)
                  if match:
                      audio_name = match.group(1).strip()
                      break
              if not audio_name: raise RuntimeError('pack AudioFilename missing')
              audio_bytes = src.read(audio_name)

          if sha(audio_bytes) != expected_audio:
              raise RuntimeError(f'official ST254 audio differs from uploaded audio: {sha(audio_bytes)}')

          output = Path('/tmp/onii-chan-migite-kinshi.osz')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_STORED) as dst:
              dst.writestr(archive_osu_name, target_osu)
              dst.writestr('audio.mp3', audio_bytes)

          bundle = Path('/tmp/maps-wave-20260830-oniichan.zip')
          with zipfile.ZipFile(bundle, 'w', compression=zipfile.ZIP_STORED) as z:
              z.write(output, arcname='onii-chan-migite-kinshi.osz')
          print('verified', output.name, output.stat().st_size)
          print('bundle_sha256', sha(bundle.read_bytes()))
          PY

      - name: Split and commit verified bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -f .map-assets/maps-wave-20260830-oniichan-*.part .map-assets/maps-wave-20260830-oniichan.sha256
          split -b 785000 -d -a 3 --additional-suffix=.part /tmp/maps-wave-20260830-oniichan.zip .map-assets/maps-wave-20260830-oniichan-
          HASH="$(sha256sum /tmp/maps-wave-20260830-oniichan.zip | awk '{print $1}')"
          printf '%s  maps-wave-20260830-oniichan.zip\n' "$HASH" > .map-assets/maps-wave-20260830-oniichan.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .map-assets/maps-wave-20260830-oniichan-*.part .map-assets/maps-wave-20260830-oniichan.sha256
          git commit -m 'Add verified Onii-chan map asset'
          git push
